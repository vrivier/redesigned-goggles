<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon interface API</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: system-ui, sans-serif;
      background: #f3f5f9;
      color: #1f2937;
    }

    main {
      max-width: 720px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 24px #0000000d;
    }

    h1 { margin-top: 0; font-size: 26px; }
    h2 { margin-top: 0; font-size: 20px; }

    [hidden] { display: none !important; }

    label {
      display: block;
      font-weight: 600;
      margin: 20px 0 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      margin-top: 16px;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    button.secondary {
      background: transparent;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .session-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .session-bar p { margin: 0; }
    .session-bar button { margin-top: 0; padding: 8px 14px; font-size: 14px; }

    pre {
      padding: 16px;
      min-height: 70px;
      overflow-x: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f1f5f9;
      border-radius: 8px;
    }

    #status { margin-top: 16px; }
    .error { color: #b91c1c; }
  </style>
</head>

<body>
  <main>
    <h1>Mon interface API</h1>

    <!-- Connexion -->
    <section id="login-section" hidden>
      <h2>Connexion</h2>
      <form id="login-form">
        <label for="username">Identifiant</label>
        <input
          id="username"
          name="username"
          autocomplete="username"
          required
        >

        <label for="password">Mot de passe</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="login-submit" type="submit">Se connecter</button>
      </form>
    </section>

    <!-- Application (visible uniquement une fois connecté) -->
    <section id="app-section" hidden>
      <div class="session-bar">
        <p id="welcome"></p>
        <button id="logout" type="button" class="secondary">
          Se déconnecter
        </button>
      </div>

      <p>Saisis un message et envoie-le à ton API.</p>

      <form id="api-form">
        <label for="message">Message</label>
        <textarea
          id="message"
          placeholder="Écris ton message ici..."
          required
        ></textarea>

        <button id="submit" type="submit">Envoyer</button>
      </form>

      <label for="response">Réponse JSON</label>
      <pre id="response">La réponse apparaîtra ici.</pre>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    // Remplace ces chemins si besoin (ou préfixe-les par l'URL
    // de ton API Render, en configurant alors CORS + cookies).
    const API_URL = "/process";
    const ME_URL = "/api/me";
    const LOGIN_URL = "/api/login";
    const LOGOUT_URL = "/api/logout";

    const loginSection = document.getElementById("login-section");
    const appSection = document.getElementById("app-section");
    const loginForm = document.getElementById("login-form");
    const loginButton = document.getElementById("login-submit");
    const form = document.getElementById("api-form");
    const messageInput = document.getElementById("message");
    const button = document.getElementById("submit");
    const logoutButton = document.getElementById("logout");
    const welcome = document.getElementById("welcome");
    const status = document.getElementById("status");
    const responseBox = document.getElementById("response");

    function setStatus(text, isError = false) {
      status.className = isError ? "error" : "";
      status.textContent = text;
    }

    // Vérifie la session et affiche la bonne section.
    async function refreshSession() {
      let response;
      try {
        response = await fetch(ME_URL);
      } catch {
        loginSection.hidden = false;
        appSection.hidden = true;
        setStatus("Erreur réseau.", true);
        return;
      }

      loginSection.hidden = response.ok;
      appSection.hidden = !response.ok;

      if (response.ok) {
        const user = await response.json();
        welcome.textContent = `Connecté en tant que ${user.username}`;
      } else {
        responseBox.textContent = "La réponse apparaîtra ici.";
      }
    }

    // Connexion
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const data = new FormData(loginForm);

      loginButton.disabled = true;
      setStatus("Connexion en cours…");

      try {
        const response = await fetch(LOGIN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: data.get("username"),
            password: data.get("password")
          })
        });

        if (!response.ok) {
          setStatus("Identifiants incorrects.", true);
          return;
        }

        loginForm.reset();
        setStatus("");
        await refreshSession();
      } catch {
        setStatus("Erreur réseau.", true);
      } finally {
        loginButton.disabled = false;
      }
    });

    // Envoi du message à l'API
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (!message) return;

      button.disabled = true;
      setStatus("Envoi de la requête...");
      responseBox.textContent = "";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        // Session expirée : retour à l'écran de connexion
        if (response.status === 401) {
          await refreshSession();
          setStatus("Reconnecte-toi pour continuer.", true);
          return;
        }

        const raw = await response.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          data = raw;
        }

        if (!response.ok) {
          throw new Error(
            `Erreur HTTP ${response.status} : ` +
            (typeof data === "string"
              ? data
              : JSON.stringify(data))
          );
        }

        responseBox.textContent =
          typeof data === "string"
            ? data
            : JSON.stringify(data, null, 2);

        setStatus("Requête réussie.");
      } catch (error) {
        setStatus(
          "Impossible de terminer la requête : " + error.message,
          true
        );
      } finally {
        button.disabled = false;
      }
    });

    // Déconnexion
    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;

      try {
        const response = await fetch(LOGOUT_URL, { method: "POST" });

        if (response.ok) {
          await refreshSession();
          setStatus("Déconnecté.");
        } else {
          setStatus("La déconnexion a échoué.", true);
        }
      } catch {
        setStatus("Erreur réseau.", true);
      } finally {
        logoutButton.disabled = false;
      }
    });

    refreshSession();
  </script>
</body>
</html>
